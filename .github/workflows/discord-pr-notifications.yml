name: Discord PR Notifications

# Just what's happening on PRs. Shame lives in discord-shame.yml.

on:
  pull_request:
    types: [opened, closed, review_requested, synchronize]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  notify:
    # Only PRs from branches in this repo (i.e. people with write access), never from forks
    # (pushes are the pushed job's)
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # PR files, for its size
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: PR opened
        if: github.event.action == 'opened'
        env:
          REQUESTED_REVIEWERS: ${{ toJSON(github.event.pull_request.requested_reviewers.*.login) }}
          DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
        run: |
          set -euo pipefail

          # Escape [ and ] so a title can't break the markdown link
          TITLE=$(printf '%s' "$PR_TITLE" | sed 's/[][]/\\&/g')

          # Requested reviewers -> Discord mentions (falls back to the GitHub username if unmapped)
          REVIEWERS=$(jq -r --argjson users "$DISCORD_USER_MAP" '
            map(if $users[.] then "<@\($users[.])>" else . end) | join(", ")
          ' <<< "$REQUESTED_REVIEWERS")

          OPEN_VERBS=("opened" "opened" "opened" "unleashed" "cooked up" "politely suggests merging" "commands us to merge")
          VERB="${OPEN_VERBS[$((RANDOM % ${#OPEN_VERBS[@]}))]}"

          # Size leaves out the generated Swagger docs (server/cmd/docs,
          # rebuilt by `swag init`), since nobody reads those by hand.
          PR_LINES_CHANGED=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            | jq -s '
                add
                | map(select(.filename | startswith("server/cmd/docs/") | not))
                | map(.additions + .deletions) | add // 0')

          # Over 1000 lines is a behemoth, which the shame bot calls out.
          SIZE_TAG=""
          if [ "$PR_LINES_CHANGED" -lt 40 ]; then
            SIZE_TAG=" (a rinky dinky lil guy 🐣, ${PR_LINES_CHANGED} lines)"
          fi

          MESSAGE="🟢 ${PR_AUTHOR} ${VERB} [${TITLE}](${PR_URL})${SIZE_TAG}."
          if [ -n "$REVIEWERS" ]; then
            MESSAGE="${MESSAGE} Review requested from ${REVIEWERS}."
          fi

          jq -n --arg content "$MESSAGE" \
            '{content: $content, flags: 4, allowed_mentions: {parse: ["users"]}}' \
            | curl -sS -f -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

      - name: PR merged
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        env:
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
        run: |
          TITLE=$(printf '%s' "$PR_TITLE" | sed 's/[][]/\\&/g')

          MERGE_VERBS=("merged" "shipped" "landed" "locked in")
          VERB="${MERGE_VERBS[$((RANDOM % ${#MERGE_VERBS[@]}))]}"

          MERGE_EMOJIS=("🎉" "🥳" "🛳️" "😰" "😭" "🫩")
          EMOJI="${MERGE_EMOJIS[$((RANDOM % ${#MERGE_EMOJIS[@]}))]}"

          # merged_by can be null — e.g. GitHub auto-merges a PR as a side
          # effect of another PR's merge landing the same commits first, with
          # no distinct person to attribute it to. Drop "by X" entirely then,
          # rather than printing "by" with nothing after it.
          if [ -n "$MERGED_BY" ]; then
            MESSAGE="🟣 [${TITLE}](${PR_URL}) ${VERB} by ${MERGED_BY} ${EMOJI}."
          else
            MESSAGE="🟣 [${TITLE}](${PR_URL}) ${VERB} ${EMOJI}."
          fi

          jq -n --arg content "$MESSAGE" \
            '{content: $content, flags: 4, allowed_mentions: {parse: ["users"]}}' \
            | curl -sS -f -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

      # requested_reviewer is singular here (one delivery per reviewer added),
      # unlike the plural requested_reviewers snapshot used above at open time.
      # A team (rather than user) review request carries requested_team
      # instead, with requested_reviewer null — the guard below no-ops then,
      # since DISCORD_USER_MAP is keyed by individual logins, not teams.
      - name: Reviewer requested
        if: github.event.action == 'review_requested' && github.event.requested_reviewer != null
        env:
          REQUESTED_REVIEWER: ${{ github.event.requested_reviewer.login }}
          DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
        run: |
          TITLE=$(printf '%s' "$PR_TITLE" | sed 's/[][]/\\&/g')

          REVIEWER=$(jq -rn --argjson users "$DISCORD_USER_MAP" --arg login "$REQUESTED_REVIEWER" '
            if $users[$login] then "<@\($users[$login])>" else $login end
          ')

          REQUEST_PHRASES=("was requested to review" "got summoned to review" '"volunteered" to review')
          PHRASE="${REQUEST_PHRASES[$((RANDOM % ${#REQUEST_PHRASES[@]}))]}"

          MESSAGE="👀 ${REVIEWER} ${PHRASE} [${TITLE}](${PR_URL})."

          jq -n --arg content "$MESSAGE" \
            '{content: $content, flags: 4, allowed_mentions: {parse: ["users"]}}' \
            | curl -sS -f -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

      # pull_request_review (not pull_request) is the event type for a
      # completed review — different payload shape: github.event.review has
      # the reviewer/state/submitted_at, while github.event.pull_request
      # still has the PR's own fields (title, url, created_at) same as above.
      # The pull_request_review webhook payload uses lowercase state values
      # ("approved", "changes_requested", "commented") — unlike the REST
      # API's reviews list endpoint, which returns them uppercase.
      # Comment-only reviews are handled by the review-comments job below.
      - name: Review submitted
        if: >-
          github.event_name == 'pull_request_review' && github.event.action == 'submitted' &&
          (github.event.review.state == 'approved' || github.event.review.state == 'changes_requested') &&
          !endsWith(github.event.review.user.login, '[bot]')
        env:
          REVIEWER: ${{ github.event.review.user.login }}
          REVIEW_STATE: ${{ github.event.review.state }}
        run: |
          TITLE=$(printf '%s' "$PR_TITLE" | sed 's/[][]/\\&/g')

          case "$REVIEW_STATE" in
            approved) EMOJI="✅"; VERB="approved" ;;
            changes_requested) EMOJI="🚫"; VERB="denied" ;;
          esac

          MESSAGE="${EMOJI} ${REVIEWER} ${VERB} [${TITLE}](${PR_URL})."

          jq -n --arg content "$MESSAGE" \
            '{content: $content, flags: 4, allowed_mentions: {parse: ["users"]}}' \
            | curl -sS -f -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

  # Comment-only reviews. Every single comment and every
  # reply to a thread arrives as its own "commented" review, so a reviewer's
  # run of comments on a PR is one Discord message: the first comment posts
  # it, and each later one edits it to "X left N comments on ...". A run ends
  # when the reviewer approves or requests changes, or after an hour with no
  # comment from them; the next comment then starts a new message.
  #
  # The Discord message ID is remembered in a short-lived artifact named after
  # the run's first review. Runs for the same reviewer on the same PR queue
  # behind each other, so two comments in quick succession can't both post.
  # A run that is skipped in the queue loses nothing: the count is rebuilt
  # from GitHub each time.
  review-comments:
    if: >-
      github.event_name == 'pull_request_review' && github.event.action == 'submitted' &&
      github.event.review.state == 'commented' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.event.review.user.login, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # the reviewer's reviews and comments on this PR
      actions: read # find and download the artifact holding the Discord message ID
    concurrency:
      group: discord-review-comments-${{ github.event.pull_request.number }}-${{ github.event.review.user.login }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      REVIEWER: ${{ github.event.review.user.login }}
      REVIEW_ID: ${{ github.event.review.id }}
      BATCH_GAP_SECONDS: 3600
    steps:
      - name: Post or update the comment message
        id: post
        run: |
          set -euo pipefail

          TITLE=$(printf '%s' "$PR_TITLE" | sed 's/[][]/\\&/g')

          REVIEWS=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" | jq -s 'add')

          # This reviewer's reviews up to this one, walked backwards: the run
          # is the unbroken stretch of COMMENTED reviews, each less than
          # BATCH_GAP_SECONDS after the one before it.
          BATCH=$(jq -c --arg login "$REVIEWER" --argjson current "$REVIEW_ID" --argjson gap "$BATCH_GAP_SECONDS" '
            map(select(.user.login == $login and .submitted_at != null))
            | sort_by(.submitted_at)
            | (map(.id) | index($current)) as $i
            | if $i == null then [] else .[:$i + 1] end
            | reverse
            | reduce .[] as $r ({batch: [], done: false, next: null};
                ($r.submitted_at | fromdateiso8601) as $t
                | if .done then .
                  elif $r.state != "COMMENTED" then .done = true
                  elif .next != null and (.next - $t) >= $gap then .done = true
                  else .batch += [$r] | .next = $t
                  end)
            | .batch | reverse
          ' <<< "$REVIEWS")

          # GitHub's reviews list can briefly lag the webhook; treat this
          # review as a run of one then.
          if [ "$(jq 'length' <<< "$BATCH")" -eq 0 ]; then
            BATCH=$(jq -cn --argjson id "$REVIEW_ID" '[{id: $id, body: ""}]')
          fi

          # Each review counts its inline comments, plus its summary if it
          # wrote one, and at least 1.
          COMMENT_COUNTS=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments?per_page=100" \
            | jq -sc 'add | group_by(.pull_request_review_id) | map({key: (.[0].pull_request_review_id | tostring), value: length}) | from_entries')
          COUNT=$(jq --argjson inline "$COMMENT_COUNTS" '
            map((($inline[.id | tostring] // 0) + (if (.body // "") != "" then 1 else 0 end)) as $n
                | if $n < 1 then 1 else $n end)
            | add
          ' <<< "$BATCH")

          if [ "$COUNT" -eq 1 ]; then
            MESSAGE="💬 ${REVIEWER} commented on [${TITLE}](${PR_URL})."
          else
            MESSAGE="💬 ${REVIEWER} left ${COUNT} comments on [${TITLE}](${PR_URL})."
          fi

          PAYLOAD=$(jq -n --arg content "$MESSAGE" \
            '{content: $content, flags: 4, allowed_mentions: {parse: ["users"]}}')

          ARTIFACT_NAME="discord-review-comments-pr${PR_NUMBER}-$(jq -r '.[0].id' <<< "$BATCH")"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

          MESSAGE_ID=""
          ARTIFACT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
            | jq -r '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > message.zip
            MESSAGE_ID=$(unzip -p message.zip discord-message.json | jq -r '.id // empty')
          fi

          # Edit the run's message if there is one; if it's gone (deleted in
          # Discord), post a new one instead.
          if [ -n "$MESSAGE_ID" ] && curl -sS -f -o /dev/null -X PATCH -H "Content-Type: application/json" \
              -d "$PAYLOAD" "${DISCORD_WEBHOOK_URL}/messages/${MESSAGE_ID}"; then
            echo "Edited message ${MESSAGE_ID}: ${COUNT} comment(s)."
          else
            # ?wait=true makes Discord return the new message, with its ID
            curl -sS -f -H "Content-Type: application/json" -d "$PAYLOAD" "${DISCORD_WEBHOOK_URL}?wait=true" \
              | jq '{id}' > discord-message.json
            echo "posted=true" >> "$GITHUB_OUTPUT"
            echo "Posted message $(jq -r .id discord-message.json): ${COUNT} comment(s)."
          fi

      - name: Remember the Discord message
        if: steps.post.outputs.posted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.post.outputs.artifact_name }}
          path: discord-message.json
          retention-days: 1

  # New commits on an open, non-draft PR, mentioning everyone who needs to look
  # again: whoever is asked to review now, plus everyone who already reviewed
  # (a push dismisses approvals on this repo's branches). Pushes within an hour
  # of the first one edit that message instead of posting again, so a string
  # of fixups pings people once. The message ID is kept in an artifact, the
  # same way as review-comments above.
  pushed:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'synchronize' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # who has reviewed this PR
      actions: read # find and download the artifact holding the Discord message ID
    concurrency:
      group: discord-push-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PUSHER: ${{ github.event.sender.login }}
      PUSHED_AT: ${{ github.event.pull_request.updated_at }}
      REQUESTED_REVIEWERS: ${{ toJSON(github.event.pull_request.requested_reviewers.*.login) }}
      BATCH_GAP_SECONDS: 3600
    steps:
      - name: Post or update the push message
        id: post
        run: |
          set -euo pipefail

          TITLE=$(printf '%s' "$PR_TITLE" | sed 's/[][]/\\&/g')

          REVIEWERS=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
            | jq -rs --argjson requested "$REQUESTED_REVIEWERS" --argjson users "$DISCORD_USER_MAP" --arg author "$PR_AUTHOR" '
                add
                | map(select(.submitted_at != null and .user.type != "Bot" and .user.login != $author) | .user.login)
                | ($requested + .) | unique
                | map(if $users[.] then "<@\($users[.])>" else . end) | join(", ")')

          MESSAGE="🔁 ${PUSHER} pushed new commits to [${TITLE}](${PR_URL})."
          if [ -n "$REVIEWERS" ]; then
            MESSAGE="${MESSAGE} Time to re-review, ${REVIEWERS}."
          fi

          ARTIFACT_NAME="discord-push-pr${PR_NUMBER}"
          NOW=$(date -u +%s)

          # The latest push message for this PR, if it was started within the hour
          MESSAGE_ID=""
          ARTIFACT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
            | jq -r '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > message.zip
            MESSAGE_ID=$(unzip -p message.zip discord-message.json \
              | jq -r --argjson now "$NOW" --argjson gap "$BATCH_GAP_SECONDS" 'select($now - .startedAt < $gap) | .id // empty')
          fi

          if [ -n "$MESSAGE_ID" ]; then
            EDITED="${MESSAGE} Latest push at $(TZ="America/New_York" date -d "$PUSHED_AT" '+%-I:%M %p')."
            PAYLOAD=$(jq -n --arg content "$EDITED" '{content: $content, flags: 4, allowed_mentions: {parse: ["users"]}}')
            if curl -sS -f -o /dev/null -X PATCH -H "Content-Type: application/json" \
                -d "$PAYLOAD" "${DISCORD_WEBHOOK_URL}/messages/${MESSAGE_ID}"; then
              echo "Edited message ${MESSAGE_ID}."
              exit 0
            fi
          fi

          # Edits don't ping anyone, so only this new message mentions the reviewers
          PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content, flags: 4, allowed_mentions: {parse: ["users"]}}')
          curl -sS -f -H "Content-Type: application/json" -d "$PAYLOAD" "${DISCORD_WEBHOOK_URL}?wait=true" \
            | jq --argjson now "$NOW" '{id, startedAt: $now}' > discord-message.json
          echo "posted=true" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "Posted message $(jq -r .id discord-message.json)."

      - name: Remember the Discord message
        if: steps.post.outputs.posted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.post.outputs.artifact_name }}
          path: discord-message.json
          retention-days: 1
