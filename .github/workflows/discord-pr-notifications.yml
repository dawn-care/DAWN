name: Discord PR Notifications

on:
  pull_request:
    types: [opened, closed, review_requested]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  notify:
    # Only PRs from branches in this repo (i.e. people with write access), never from forks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_ADDITIONS: ${{ github.event.pull_request.additions }}
      PR_DELETIONS: ${{ github.event.pull_request.deletions }}
      PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
    steps:
      - name: PR opened
        if: github.event.action == 'opened'
        env:
          REQUESTED_REVIEWERS: ${{ toJSON(github.event.pull_request.requested_reviewers.*.login) }}
          DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
        run: |
          # Escape [ and ] so a title can't break the markdown link
          TITLE=$(printf '%s' "$PR_TITLE" | sed 's/[][]/\\&/g')

          # Requested reviewers -> Discord mentions (falls back to the GitHub username if unmapped)
          REVIEWERS=$(jq -r --argjson users "$DISCORD_USER_MAP" '
            map(if $users[.] then "<@\($users[.])>" else . end) | join(", ")
          ' <<< "$REQUESTED_REVIEWERS")

          OPEN_VERBS=("opened" "opened" "opened" "unleashed" "cooked up" "politely suggests merging" "commands us to merge")
          VERB="${OPEN_VERBS[$((RANDOM % ${#OPEN_VERBS[@]}))]}"

          PR_LINES_CHANGED=$((PR_ADDITIONS + PR_DELETIONS))
          SIZE_TAG=""
          if [ "$PR_LINES_CHANGED" -lt 40 ]; then
            SIZE_TAG=" (a rinky dinky lil guy 🐣, ${PR_LINES_CHANGED} lines)"
          elif [ "$PR_LINES_CHANGED" -gt 1000 ]; then
            SIZE_TAG=" (a grotesque behemoth monstrosity 🧌, ${PR_LINES_CHANGED} lines)"
          fi

          MESSAGE="🟢 ${PR_AUTHOR} ${VERB} [${TITLE}](${PR_URL})${SIZE_TAG}."
          if [ -n "$REVIEWERS" ]; then
            MESSAGE="${MESSAGE} Review requested from ${REVIEWERS}."
          fi

          # 1am-5am Eastern (matches the team's actual timezone, not UTC)
          HOUR_ET=$(TZ="America/New_York" date -d "$PR_CREATED_AT" +%H)
          if [ "$HOUR_ET" -ge 1 ] && [ "$HOUR_ET" -lt 5 ]; then
            MESSAGE="${MESSAGE} (also ${PR_AUTHOR} should go to bed 🫵😐)"
          fi

          jq -n --arg content "$MESSAGE" \
            '{content: $content, flags: 4, allowed_mentions: {parse: ["users"]}}' \
            | curl -sS -f -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

      - name: PR merged
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        env:
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: |
          TITLE=$(printf '%s' "$PR_TITLE" | sed 's/[][]/\\&/g')

          MERGE_VERBS=("merged" "shipped" "landed" "locked in")
          VERB="${MERGE_VERBS[$((RANDOM % ${#MERGE_VERBS[@]}))]}"

          MERGE_EMOJIS=("🎉" "🥳" "🛳️" "😰" "😭" "🫩")
          EMOJI="${MERGE_EMOJIS[$((RANDOM % ${#MERGE_EMOJIS[@]}))]}"

          # merged_by can be null — e.g. GitHub auto-merges a PR as a side
          # effect of another PR's merge landing the same commits first, with
          # no distinct person to attribute it to. Drop "by X" entirely then,
          # rather than printing "by" with nothing after it.
          if [ -n "$MERGED_BY" ]; then
            MESSAGE="🟣 [${TITLE}](${PR_URL}) ${VERB} by ${MERGED_BY} ${EMOJI}."
          else
            MESSAGE="🟣 [${TITLE}](${PR_URL}) ${VERB} ${EMOJI}."
          fi

          # 1am-5am Eastern (matches the team's actual timezone, not UTC)
          HOUR_ET=$(TZ="America/New_York" date -d "$PR_MERGED_AT" +%H)
          if [ -n "$MERGED_BY" ] && [ "$HOUR_ET" -ge 1 ] && [ "$HOUR_ET" -lt 5 ]; then
            MESSAGE="${MESSAGE} (also plz go to sleep ${MERGED_BY} 🫵😐)"
          fi

          jq -n --arg content "$MESSAGE" \
            '{content: $content, flags: 4, allowed_mentions: {parse: ["users"]}}' \
            | curl -sS -f -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

      # requested_reviewer is singular here (one delivery per reviewer added),
      # unlike the plural requested_reviewers snapshot used above at open time.
      # A team (rather than user) review request carries requested_team
      # instead, with requested_reviewer null — the guard below no-ops then,
      # since DISCORD_USER_MAP is keyed by individual logins, not teams.
      - name: Reviewer requested
        if: github.event.action == 'review_requested' && github.event.requested_reviewer != null
        env:
          REQUESTED_REVIEWER: ${{ github.event.requested_reviewer.login }}
          DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
        run: |
          TITLE=$(printf '%s' "$PR_TITLE" | sed 's/[][]/\\&/g')

          REVIEWER=$(jq -rn --argjson users "$DISCORD_USER_MAP" --arg login "$REQUESTED_REVIEWER" '
            if $users[$login] then "<@\($users[$login])>" else $login end
          ')

          REQUEST_PHRASES=("was requested to review" "got summoned to review" '"volunteered" to review')
          PHRASE="${REQUEST_PHRASES[$((RANDOM % ${#REQUEST_PHRASES[@]}))]}"

          MESSAGE="👀 ${REVIEWER} ${PHRASE} [${TITLE}](${PR_URL})."

          jq -n --arg content "$MESSAGE" \
            '{content: $content, flags: 4, allowed_mentions: {parse: ["users"]}}' \
            | curl -sS -f -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

      # pull_request_review (not pull_request) is the event type for a
      # completed review — different payload shape: github.event.review has
      # the reviewer/state/submitted_at, while github.event.pull_request
      # still has the PR's own fields (title, url, created_at) same as above.
      - name: Review submitted
        if: >-
          github.event_name == 'pull_request_review' && github.event.action == 'submitted' &&
          !endsWith(github.event.review.user.login, '[bot]')
        env:
          REVIEWER: ${{ github.event.review.user.login }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_SUBMITTED_AT: ${{ github.event.review.submitted_at }}
        run: |
          TITLE=$(printf '%s' "$PR_TITLE" | sed 's/[][]/\\&/g')

          case "$REVIEW_STATE" in
            APPROVED) EMOJI="✅"; VERB="approved" ;;
            CHANGES_REQUESTED) EMOJI="🚫"; VERB="denied" ;;
            *) EMOJI="💬"; VERB="commented on" ;;
          esac

          MESSAGE="${EMOJI} ${REVIEWER} ${VERB} [${TITLE}](${PR_URL})"

          HOURS_TO_REVIEW=$(( ( $(date -u -d "$REVIEW_SUBMITTED_AT" +%s) - $(date -u -d "$PR_CREATED_AT" +%s) ) / 3600 ))
          if [ "$HOURS_TO_REVIEW" -gt 24 ]; then
            MESSAGE="${MESSAGE} after ${HOURS_TO_REVIEW} hours (shame)"
          fi
          MESSAGE="${MESSAGE}."

          # 1am-5am Eastern (matches the team's actual timezone, not UTC)
          HOUR_ET=$(TZ="America/New_York" date -d "$REVIEW_SUBMITTED_AT" +%H)
          if [ "$HOUR_ET" -ge 1 ] && [ "$HOUR_ET" -lt 5 ]; then
            MESSAGE="${MESSAGE} Also, go to sleep ${REVIEWER} 🫵😐"
          fi

          jq -n --arg content "$MESSAGE" \
            '{content: $content, flags: 4, allowed_mentions: {parse: ["users"]}}' \
            | curl -sS -f -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
