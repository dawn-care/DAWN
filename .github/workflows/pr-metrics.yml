name: PR Review Metrics

# Tracks how many merged PRs each person has reviewed, so review load is
# visible across the team (#464). Recomputes from full history every run
# rather than keeping incremental state, so a dismissed/edited review or a
# bot-list change on an old PR is never missed.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # to push metrics/reviewers.json to the metrics branch
  pull-requests: read # to fetch merged PRs and their reviews

jobs:
  compute:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch merged PRs and their reviews
        run: |
          set -euo pipefail

          OWNER="${GITHUB_REPOSITORY%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"

          # Reviews use author { __typename } rather than a login suffix to
          # tell bots from people: GitHub's own reviewer bots (e.g. Copilot's
          # "copilot-pull-request-reviewer") don't use the "[bot]"-suffixed
          # login convention other bots do, so a suffix check alone misses
          # them. first: 100 reviews per PR isn't paginated further - no PR
          # in this repo's history has come close to that many.
          read -r -d '' QUERY <<'GRAPHQL' || true
          query($owner: String!, $name: String!, $endCursor: String) {
            repository(owner: $owner, name: $name) {
              pullRequests(states: MERGED, first: 50, after: $endCursor, orderBy: {field: CREATED_AT, direction: ASC}) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  number
                  author { login }
                  reviews(first: 100) {
                    nodes {
                      author { __typename login }
                      submittedAt
                    }
                  }
                }
              }
            }
          }
          GRAPHQL

          gh api graphql --paginate -f query="$QUERY" -F owner="$OWNER" -F name="$NAME" \
            | jq -s '[.[].data.repository.pullRequests.nodes] | add' \
            > merged_prs.json

          echo "Fetched $(jq 'length' merged_prs.json) merged PRs."

      - name: Compute per-person review counts
        run: |
          set -euo pipefail

          WINDOW_DAYS=14
          CUTOFF=$(date -u -d "${WINDOW_DAYS} days ago" +"%Y-%m-%dT%H:%M:%SZ")
          GENERATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # One row per (reviewer, PR), keeping that reviewer's most recent
          # review on it - a reviewer who reviewed the same PR twice counts
          # for that PR once, and whether it's "recent" follows their latest
          # activity on it. Bots and the PR author reviewing their own PR
          # (both happen in this repo's history) are excluded - this is a
          # team review-load metric, not a raw review-event count.
          jq -c '
            [.[] | .number as $pr | .author.login as $prAuthor |
              .reviews.nodes[] |
              select(.author.__typename == "User") |
              select(.author.login != $prAuthor) |
              {reviewer: .author.login, pr: $pr, submittedAt: .submittedAt}
            ]
            | group_by([.reviewer, .pr]) | map(max_by(.submittedAt))
          ' merged_prs.json > deduped_reviews.json

          mkdir -p metrics
          jq -n \
            --arg generatedAt "$GENERATED_AT" \
            --argjson windowDays "$WINDOW_DAYS" \
            --arg cutoff "$CUTOFF" \
            --slurpfile rows deduped_reviews.json '
            def countByReviewer: group_by(.reviewer) | map({(.[0].reviewer): length}) | add // {};
            {
              generatedAt: $generatedAt,
              windowDays: $windowDays,
              allTime: ($rows[0] | countByReviewer),
              trailingWindow: ($rows[0] | map(select(.submittedAt >= $cutoff)) | countByReviewer)
            }
          ' > metrics/reviewers.json

          cat metrics/reviewers.json

      - name: Commit to the metrics branch
        run: |
          set -euo pipefail

          cp metrics/reviewers.json /tmp/reviewers.json
          rm -rf metrics # untracked - would collide with the metrics branch's own checkout below

          git fetch origin metrics || true
          if git show-ref --verify --quiet refs/remotes/origin/metrics; then
            git switch metrics # replaces the working tree with the branch's own (just the 2 files below)
          else
            git switch --orphan metrics # starts with an empty index and working tree
          fi

          mkdir -p metrics
          cp /tmp/reviewers.json metrics/reviewers.json

          cat > metrics/README.md <<'MARKDOWN'
          # Metrics

          Generated by [`.github/workflows/pr-metrics.yml`](https://github.com/dawn-care/DAWN/blob/canary/.github/workflows/pr-metrics.yml)
          on a nightly schedule (and on manual `workflow_dispatch`). Each run
          recomputes every file here from the full PR history and overwrites
          it - nothing is appended or merged with the previous run.

          ## `reviewers.json`

          Per-person count of merged PRs reviewed.

          ```json
          {
            "generatedAt": "2026-11-05T05:00:00Z",
            "windowDays": 14,
            "allTime": { "<login>": <count> },
            "trailingWindow": { "<login>": <count> }
          }
          ```

          - `generatedAt`: when this run produced the file (UTC).
          - `windowDays`: the width of `trailingWindow`, in days, so a reader doesn't have to hardcode it.
          - `allTime` / `trailingWindow`: GitHub login to number of merged PRs that person left at least one review on, either ever (`allTime`) or within the last `windowDays` days of `generatedAt` (`trailingWindow`). A PR reviewed more than once by the same person still counts once.
          - Excluded from both: bot reviewers (GitHub `Bot` accounts, e.g. Copilot's reviewer), and a PR author's own review of their own PR. Both happen in this repo's history and aren't review-load signal.
          MARKDOWN

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics/reviewers.json metrics/README.md
          git commit -m "Update PR review metrics" || echo "No changes to commit."
          git push origin metrics
