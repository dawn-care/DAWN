name: PR Metrics

# Publishes raw facts about every merged PR (metrics/pull-requests.json on the
# metrics branch) for the team site's /metrics page, which computes the PR
# metrics itself. Rebuilt from full history every run (.github/scripts/pr-metrics/).
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # to push to the metrics branch
  pull-requests: read # merged PRs, their reviews and changed files
  issues: read # labels of the issues PRs are linked to

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect metrics/pull-requests.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/pr-metrics/main.mjs --out /tmp/pull-requests.json

      - name: Commit to the metrics branch
        run: |
          set -euo pipefail
          cp .github/scripts/pr-metrics/README.md /tmp/metrics-README.md

          git fetch origin metrics || true
          if git show-ref --verify --quiet refs/remotes/origin/metrics; then
            git switch metrics
          else
            git switch --orphan metrics
          fi

          mkdir -p metrics
          cp /tmp/pull-requests.json metrics/pull-requests.json
          cp /tmp/metrics-README.md metrics/README.md
          # The old per-reviewer counts are no longer produced.
          git rm --quiet --ignore-unmatch metrics/reviewers.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics/pull-requests.json metrics/README.md
          git commit -m "Update PR metrics" || echo "No changes to commit."
          git push origin metrics
