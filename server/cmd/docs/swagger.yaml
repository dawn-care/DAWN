paths:
  /audio:
    delete:
      description: Deletes audio metadata from the database
      parameters:
      - description: Audio ID
        in: query
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: invalid audio ID
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Delete an audio metadata record
      tags:
      - audio
    get:
      description: Retrieves audio metadata from the database
      parameters:
      - description: Audio ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/media.AudioMedia'
        "400":
          description: invalid audio ID
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get audio metadata by ID
      tags:
      - audio
    post:
      consumes:
      - application/json
      description: Creates a new audio entry in the database
      parameters:
      - description: Audio data
        in: body
        name: audio
        required: true
        schema:
          $ref: '#/definitions/media.AudioMedia'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/media.AudioMedia'
        "400":
          description: invalid request body
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Create a new audio record
      tags:
      - audio
    put:
      consumes:
      - application/json
      description: Updates audio metadata in the database
      parameters:
      - description: Audio data
        in: body
        name: audio
        required: true
        schema:
          $ref: '#/definitions/media.AudioMedia'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/media.AudioMedia'
        "400":
          description: invalid request body
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Update an audio metadata record
      tags:
      - audio
  /audio/file:
    delete:
      description: Deletes audio file from blob storage
      parameters:
      - description: Audio ID
        in: query
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: invalid audio ID
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Delete an audio file
      tags:
      - audio
    get:
      description: Retrieves the audio file from blob storage
      parameters:
      - description: Audio ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Audio file
          schema:
            type: file
        "400":
          description: invalid audio ID
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Download audio file by ID
      tags:
      - audio
    post:
      consumes:
      - multipart/form-data
      description: Uploads an audio file to blob storage
      parameters:
      - description: Audio file
        in: formData
        name: file
        required: true
        type: file
      - description: User ID
        in: formData
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Upload a new audio file
      tags:
      - audio
    put:
      consumes:
      - multipart/form-data
      description: Uploads and replaces an existing audio file
      parameters:
      - description: Audio file
        in: formData
        name: file
        required: true
        type: file
      - description: User ID
        in: formData
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Update an audio file
      tags:
      - audio
  /audio/list:
    get:
      description: Retrieves a list of audios filtered by carepartner ID and caregiver
        ID
      parameters:
      - description: Carepartner ID
        in: query
        name: carepartner_id
        required: true
        type: integer
      - description: Caregiver ID
        in: query
        name: caregiver_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
