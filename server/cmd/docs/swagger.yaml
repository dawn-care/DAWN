  contact: {}
paths:
  /audio:
    delete:
      description: Deletes audio metadata from the database
      parameters:
      - description: Audio ID
        in: query
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: invalid audio ID
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Delete an audio metadata record
      tags:
      - audio
    get:
      description: Retrieves audio metadata from the database
      parameters:
      - description: Audio ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/media.AudioMedia'
        "400":
          description: invalid audio ID
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get audio metadata by ID
      tags:
      - audio
    post:
      consumes:
      - application/json
      description: Creates a new audio entry in the database
      parameters:
      - description: Audio data
        in: body
        name: audio
        required: true
        schema:
          $ref: '#/definitions/media.AudioMedia'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/media.AudioMedia'
        "400":
          description: invalid request body
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Create a new audio record
      tags:
      - audio
    put:
      consumes:
      - application/json
      description: Updates audio metadata in the database
      parameters:
      - description: Audio data
        in: body
        name: audio
        required: true
        schema:
          $ref: '#/definitions/media.AudioMedia'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/media.AudioMedia'
        "400":
          description: invalid request body
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Update an audio metadata record
      tags:
      - audio
  /audio/file:
    delete:
      description: Deletes audio file from blob storage
      parameters:
      - description: Audio ID
        in: query
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: invalid audio ID
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Delete an audio file
      tags:
      - audio
    get:
      description: Retrieves the audio file from blob storage
      parameters:
      - description: Audio ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Audio file
          schema:
            type: file
        "400":
          description: invalid audio ID
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Download audio file by ID
      tags:
      - audio
    post:
      consumes:
      - multipart/form-data
      description: Uploads an audio file to blob storage
      parameters:
      - description: Audio file
        in: formData
        name: file
        required: true
        type: file
      - description: User ID
        in: formData
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Upload a new audio file
      tags:
      - audio
    put:
      consumes:
      - multipart/form-data
      description: Uploads and replaces an existing audio file
      parameters:
      - description: Audio file
        in: formData
        name: file
        required: true
        type: file
      - description: User ID
        in: formData
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Update an audio file
      tags:
      - audio
  /audio/list:
    get:
      description: Retrieves a list of audios filtered by carepartner ID and caregiver
        ID
      parameters:
      - description: Carepartner ID
        in: query
        name: carepartner_id
        required: true
        type: integer
      - description: Caregiver ID
        in: query
        name: caregiver_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/media.AudioMedia'
            type: array
        "400":
          description: invalid or missing parameters
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get audios by carepartner and caregiver
      tags:
      - audio
  /calendar:
    get:
      description: Repeating items are expanded on the server, skipped days are left
        out, and outside_awake_hours reflects the current awake hours. from and to
        are inclusive and at most 62 days apart.
      parameters:
      - description: Carepartner ID
        in: query
        name: carepartner_id
        required: true
        type: integer
      - description: YYYY-MM-DD
        in: query
        name: from
        required: true
        type: string
      - description: YYYY-MM-DD
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/scheduled_items.Occurrence'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/scheduled_items.ScheduledItemError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/scheduled_items.ScheduledItemError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/scheduled_items.ScheduledItemError'
      summary: Dated occurrences of a carepartner's scheduled items
      tags:
      - scheduled-items
  /caregiver-location:
    delete:
      consumes:
      - application/json
      description: Deletes a caregiver location record by its unique ID
      parameters:
      - description: Caregiver location ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: invalid caregiver location ID
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Delete a caregiver location
      tags:
      - caregiver-location
    get:
      consumes:
      - application/json
      description: Retrieves a caregiver location record by its unique ID
      parameters:
      - description: Caregiver location ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/prompts.CaregiverLocationPrompt'
        "400":
          description: invalid caregiver location ID
          schema:
            type: string
        "404":
          description: caregiver location not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get a caregiver location by ID
      tags:
      - caregiver-location
    post:
      consumes:
      - application/json
      description: Creates a new caregiver location record
      parameters:
      - description: Caregiver location data
        in: body
        name: location
        required: true
        schema:
          $ref: '#/definitions/prompts.CaregiverLocationPrompt'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/prompts.CaregiverLocationPrompt'
        "400":
          description: invalid request body
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Create a new caregiver location
      tags:
      - caregiver-location
    put:
      consumes:
      - application/json
      description: Updates a caregiver location record by ID
      parameters:
      - description: Updated caregiver location data (must include ID)
        in: body
        name: location
        required: true
        schema:
          $ref: '#/definitions/prompts.CaregiverLocationPrompt'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/prompts.CaregiverLocationPrompt'
        "400":
          description: invalid request body or missing ID
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Update an existing caregiver location
      tags:
      - caregiver-location
  /caregivers:
    get:
      consumes:
      - application/json
      description: Retrieves a list of all caregivers
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/caregiver.Caregiver'
            type: array
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all caregivers
      tags:
      - caregiver
    post:
      consumes:
      - application/json
      description: Creates a new caregiver record
      parameters:
      - description: Caregiver to create
        in: body
        name: caregiver
        required: true
        schema:
          $ref: '#/definitions/caregiver.Caregiver'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
