  /playbacks/{id}/stop:
    post:
      consumes:
      - application/json
      description: |-
        A command the tablet has not accepted yet is cancelled and recorded as stopped (200).
        If the tablet may be playing, the stop is sent to it and the record changes only when the tablet reports "stopped" (202).
        If that tablet is not connected, nothing changes (409), so the record never says stopped while a clip still plays.
      parameters:
      - description: Playback ID
        in: path
        name: id
        required: true
        type: integer
      - description: Carepartner the playback belongs to
        in: body
        name: stop
        required: true
        schema:
          $ref: '#/definitions/playback.StopRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/playback.CommandResponse'
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/playback.CommandResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Stop a playback on a carepartner's tablet (staff)
      tags:
      - playback
