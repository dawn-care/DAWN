      description: 'Send every widget on the screen. A widget with an id updates that
        widget (its type can''t change); one without an id is created; the carepartner''s
        other widgets are deleted. widgets is required: send [] to clear the screen.
        Every widget must lie inside the 4x3 grid and no two may share a cell. Nothing
        is saved if any widget is invalid; errors name the widget by its index, e.g.
        "widgets[2]". The saved widgets come back in the order they were sent.'
