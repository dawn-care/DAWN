
version: "3.9"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_NAME: mydb
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: localuser
      MINIO_SECRET_KEY: localpass123
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    container_name: server
    ports:
      - "8080:8080"
    networks:
      - app-network

  caregiver:
    build:
      context: ./caregiver
      dockerfile: Dockerfile
    container_name: caregiver
    ports:
      - "3001:80"
    depends_on:
      - server
    networks:
      - app-network

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d/:ro
    ports:
     # - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: localuser
      MINIO_ROOT_PASSWORD: localpass123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 localuser localpass123;
      mc mb --ignore-existing minio/media;
      mc cp --recursive /media-files/ minio/media/users/1/;
      echo 'MinIO bucket initialized with media files';
      "
    volumes:
      - ./minio-init/storage:/media-files
    networks:
      - app-network

volumes:
  db-data:
  minio-data:

networks:
  app-network:
    driver: bridge