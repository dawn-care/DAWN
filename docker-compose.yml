version: "3.9"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
        DB_HOST: db
        DB_PORT: 5432
        DB_USER: username
        DB_PASSWORD: password
        DB_NAME: db
    depends_on:
      - db
    container_name: server
    ports:
      - "8080:8080"
    networks:
      - app-network

  caregiver:
    build:
      context: ./caregiver
      dockerfile: Dockerfile
    container_name: caregiver
    ports:
      - "3001:80"
    depends_on:
      - server
    networks:
      - app-network

  carepartner:
    build:
      context: ./carepartner
      dockerfile: Dockerfile
    container_name: carepartner
    ports:
      - "3002:80"
    depends_on:
      - server
    networks:
      - app-network

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
