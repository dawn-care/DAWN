version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        VITE_API_URL: https://startup-da.gccis.rit.edu/api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_NAME: mydb
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: localuser
      MINIO_SECRET_KEY: localpass123
      API_URL: https://startup-da.gccis.rit.edu
      OPENWEATHER_API_KEY: 30d992579f0ac7f70e065cf0afaa070d
      NEWS_API_KEY: 3bc060a2d2c146bf92e6d9b94341d739
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    container_name: server
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
    volumes:
      - cert-data:/certs
    networks:
      - app-network

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d/:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: localuser
      MINIO_ROOT_PASSWORD: localpass123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 localuser localpass123;
      mc mb --ignore-existing minio/media;
      mc cp --recursive /media-files/ minio/media/users/1/;
      echo 'MinIO bucket initialized with media files';
      "
    volumes:
      - ./minio-init/storage:/media-files
    networks:
      - app-network

  carepartner-build:
    profiles:
      - build-rpi
    build:
      context: ./carepartner
      dockerfile: Dockerfile.build
      args:
        API_URL: http://startup-da.gccis.rit.edu/api
    container_name: carepartner-build
    volumes:
      - ./carepartner/electron-dist:/artifacts
    command: >
      /bin/sh -c "
      mkdir -p /artifacts;
      cp -f /out/*.deb /artifacts/;
      ls -l /artifacts;
      "

volumes:
  db-data:
  minio-data:
  cert-data:

networks:
  app-network:
    driver: bridge