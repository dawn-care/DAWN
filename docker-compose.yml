version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        VITE_API_URL: https://startup-da.gccis.rit.edu/api
        VITE_CAREPARTNER_URL: https://startup-da.gccis.rit.edu/carepartner/
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env (see .env.example)}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: myuser
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
      DB_NAME: mydb
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env (see .env.example)}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env (see .env.example)}
      API_URL: https://startup-da.gccis.rit.edu
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      NEWS_API_KEY: ${NEWS_API_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: "${SMTP_FROM:-}"
      LOGIN_CODE_SECRET: ${LOGIN_CODE_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env (see .env.example)}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    container_name: server
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
    volumes:
      - cert-data:/certs
    networks:
      - app-network

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: myuser
      # Only used when the database is first created. To change the password of an
      # existing database, see "Changing the database password" in README.md.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: mydb
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env (see .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env (see .env.example)}
    command: server /data --console-address ":9001"
    # No published ports: the server reaches MinIO inside app-network, and the API and console
    # stay off the internet. docker-compose.dev.yml publishes them on localhost for development.
    volumes:
      - minio-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: pgsty/mc
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env (see .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env (see .env.example)}
    # $$ leaves the variables for the container's shell, so the password isn't in the command line.
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      mc mb --ignore-existing minio/media;
      mc cp --recursive /media-files/ minio/media/users/1/;
      echo 'MinIO bucket initialized with media files';
      "
    volumes:
      - ./minio-init/storage:/media-files
    networks:
      - app-network

volumes:
  db-data:
  minio-data:
  cert-data:

networks:
  app-network:
    driver: bridge
