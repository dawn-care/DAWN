version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env (see .env.example)}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_NAME: mydb
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: localuser
      MINIO_SECRET_KEY: localpass123
      API_URL: http://localhost:8080
      RUN_MODE: dev
      PORT: 8080
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      NEWS_API_KEY: ${NEWS_API_KEY}
      # Sign-in code emails go to Mailpit (inbox at http://localhost:8025) unless SMTP_* in .env
      # points at a real mail server
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: "${SMTP_FROM:-D.A.W.N. <no-reply@dawn.local>}"
      # Hashes sign-in codes. This default is for local development only, never production.
      LOGIN_CODE_SECRET: ${LOGIN_CODE_SECRET:-dev-only-secret-not-for-production-0123456789}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env (see .env.example)}
    ports:
      - "8080:8080"
    volumes: []

  # Catches every email the server sends in development; nothing leaves your machine
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025" # inbox in the browser
      - "1025:1025" # SMTP
