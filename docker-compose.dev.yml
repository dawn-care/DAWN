version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_NAME: mydb
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: localuser
      MINIO_SECRET_KEY: localpass123
      API_URL: http://localhost:8080
      RUN_MODE: dev
      PORT: 8080
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      NEWS_API_KEY: ${NEWS_API_KEY}
      GOOGLE_CLIENT_ID: "533592863390-120rud7incnvs8d4vecocs07cpt5ij5m.apps.googleusercontent.com"
    ports:
      - "8080:8080"
    volumes: []
