version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api
        VITE_CAREPARTNER_URL: http://localhost:8080/carepartner/
        CAREPARTNER_API_URL: http://localhost:8080/api
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env (see .env.example)}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_NAME: mydb
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: localuser
      MINIO_SECRET_KEY: localpass123
      API_URL: http://localhost:8080
      RUN_MODE: dev
      PORT: 8080
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      NEWS_API_KEY: ${NEWS_API_KEY}
      # Sign-in code emails. With SMTP_HOST empty, the server prints the email, and the code in
      # it, in its log instead of sending it. Set SMTP_* in .env to send real emails.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: "${SMTP_FROM:-}"
      # Hashes sign-in codes. This default is for local development only, never production.
      LOGIN_CODE_SECRET: ${LOGIN_CODE_SECRET:-dev-only-secret-not-for-production-0123456789}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env (see .env.example)}
    ports:
      - "8080:8080"
    volumes: []
